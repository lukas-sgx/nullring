name: Bug report
description: Report unexpected behavior in the kernel, build system, or drivers
title: "[BUG] "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: One or two sentences describing the bug
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Boot / Bootloader
        - Memory Management (paging, allocator)
        - Scheduler / Process Management
        - Drivers
        - Filesystem
        - Syscalls / ABI
        - Interrupts / Exceptions
        - Build / Tooling
        - Documentation
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to Reproduce
      placeholder: |
        1. 
        2. 
        3. 
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      placeholder: |
        - Kernel version / commit:
        - Host OS:
        - Rust toolchain (rustc --version):
        - Target triple (e.g. x86_64-unknown-none):
        - Emulator (e.g. QEMU) and version:
        - Real hardware: yes/no
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / Panic output
      description: Paste relevant terminal output, build errors, kernel panic/backtrace, or serial console logs
      render: shell

  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - "Low — cosmetic / minor inconvenience"
        - "Medium — affects functionality but has a workaround"
        - "High — breaks core functionality, no workaround"
        - "Critical — kernel panic / boot failure / memory corruption"
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance Criteria
      value: |
        - [ ] Root cause identified
        - [ ] Fix verified on QEMU
        - [ ] Regression test added (where applicable)
        - [ ] Checked for `unsafe` soundness implications