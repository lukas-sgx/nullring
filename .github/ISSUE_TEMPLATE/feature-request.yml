name: Feature request
description: Propose a new feature or capability for the kernel
title: "[FEATURE] "
labels: ["enhancement"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: One or two sentences describing what this issue delivers
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Boot / Bootloader
        - Memory Management (paging, allocator)
        - Scheduler / Process Management
        - Drivers
        - Filesystem
        - Syscalls / ABI
        - Interrupts / Exceptions
        - Build / Tooling
        - Documentation
    validations:
      required: true

  - type: textarea
    id: background
    attributes:
      label: Background
      description: Why is this needed? Roadmap item, related issue, dependency?

  - type: textarea
    id: scope
    attributes:
      label: Scope
      placeholder: |
        In scope:
        - 

        Out of scope:
        - 

  - type: textarea
    id: tasks
    attributes:
      label: Tasks
      value: |
        - [ ] 
        - [ ] 
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance Criteria
      value: |
        - [ ] Builds cleanly with no warnings (`cargo clippy -- -D warnings`)
        - [ ] Verified on emulator (QEMU) with a concrete test case
        - [ ] `unsafe` blocks justified / documented
        - [ ] Documented

  - type: input
    id: dependencies
    attributes:
      label: Dependencies (blocked by / blocks)
      placeholder: "Blocked by #X, Blocks #Y"